name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          # Six jobs is enough; the oldest interpreter only needs one OS.
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[plots]"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  reproducible:
    name: Committed results regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[plots]"
      # The committed table is the evidence for every number in the README. If
      # the documented command no longer produces it, the table is stale.
      - name: Re-run the evaluation and compare
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python scripts/check_repro.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install flake8
      - name: Undefined names, unused imports, syntax errors
        run: >-
          python -m flake8 --select=F401,F811,F821,F841,E999 --max-line-length=200
          src tests scripts
