version: 2

# Everything tracked here is a development tool; the package has no runtime
# dependency on any of it. A major bump needs a read of the changelog, not a pull
# request that arrives on its own and runs the full matrix.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        applies-to: version-updates
        update-types: ["patch", "minor"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
