[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-diff"
version = "1.0.0"
description = "Differential automata learning for protocol state bugs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blue" }]
keywords = ["protocol", "state-machine", "automata-learning", "model-learning", "differential-testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["flake8>=7.0", "matplotlib>=3.8"]

[project.scripts]
protocol-diff = "protocol_diff.cli:main"

[project.urls]
Homepage = "https://github.com/nebula-eng/protocol-diff"
Documentation = "https://github.com/nebula-eng/protocol-diff/tree/main/docs"
Issues = "https://github.com/nebula-eng/protocol-diff/issues"
Changelog = "https://github.com/nebula-eng/protocol-diff/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
